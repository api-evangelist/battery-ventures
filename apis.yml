aid: battery-ventures
name: Battery Ventures
description: >-
  Battery Ventures is a global, technology-focused investment firm founded in
  1983 and headquartered in Boston, Massachusetts, with additional offices in
  San Francisco, Menlo Park, New York, London, and Tel Aviv. Battery invests
  across every stage of a company's life, from seed and early-stage venture
  through growth equity and private-equity buyouts, giving the firm a
  distinctive multi-stage perspective on technology markets. Its core areas of
  focus are application software, infrastructure software, consumer technology,
  and industrial tech plus life-science tools. As of 2025 the firm reports
  having invested in more than 530 companies over its 40-plus-year history, of
  which roughly 70 have gone public and another 185 have been merged or
  acquired. Battery is currently investing out of its 15th flagship fund,
  Battery Ventures XV, capitalized at $3.25 billion, and has raised more than
  $16 billion across all of its funds since inception. The firm describes itself
  as decisive, hard-working, and thesis-driven, backing category-defining
  companies including Affirm, Amplitude, AppDynamics, Avalara, Akamai, Coupa,
  Wonolo, and many others. This profile tracks Battery Ventures' identity and
  its portfolio graph across the API Evangelist network.
